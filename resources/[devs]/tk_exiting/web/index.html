<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1600, height=800, initial-scale=1.0"/>
  <title>TK Exit DUI</title>
  <style>
    :root{
      --bg: #0a0a0f;
      --bg2: #12121a; 
      --bg3: #1a1a24;
      --fg: #e8eaed;
      --fg-dim: #9ca3af;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.4);
      --border: rgba(99, 102, 241, 0.2);
      --fs: 1.1;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1920px;
      height: 960px;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Arial, sans-serif;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      overflow: hidden;
    }

    @keyframes slideIn {
      0% {
        opacity: 0;
        transform: translateY(-20px) scale(0.95);
        filter: blur(4px);
      }
      50% {
        opacity: 0.7;
        transform: translateY(-5px) scale(0.98);
        filter: blur(1px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes slideOut {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
      100% {
        opacity: 0;
        transform: translateY(15px) scale(0.96);
        filter: blur(3px);
      }
    }

    @keyframes pulse {
      0%, 100% { 
        transform: scale(1);
        box-shadow: 0 0 0 0 var(--danger-glow);
      }
      50% { 
        transform: scale(1.1);
        box-shadow: 0 0 0 8px rgba(239, 68, 68, 0.1);
      }
    }

    @keyframes shimmer {
      0% { 
        background-position: -100% 0;
        opacity: 0.8;
      }
      50% {
        opacity: 1;
      }
      100% { 
        background-position: 100% 0;
        opacity: 0.8;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: 
        linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(168, 85, 247, 0.06)),
        linear-gradient(180deg, var(--bg2), var(--bg));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      position: relative;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.4),
        0 8px 16px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: slideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: center top;
    }

    .card.closing {
      animation: slideOut 0.4s cubic-bezier(0.55, 0.06, 0.68, 0.19) forwards;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      background: linear-gradient(45deg, transparent, var(--accent), transparent);
      border-radius: 16px;
      opacity: 0.6;
      z-index: -1;
      animation: shimmer 3s ease-in-out infinite;
      background-size: 200% 200%;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: var(--danger);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .status-text {
      color: var(--danger);
      font-weight: 600;
      font-size: calc(var(--fs) * 12px);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .timestamp {
      color: var(--fg-dim);
      font-size: calc(var(--fs) * 12px);
      font-weight: 500;
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    .player-info {
      margin-bottom: 16px;
    }

    .player-name {
      color: var(--fg);
      font-size: calc(var(--fs) * 26px);
      font-weight: 700;
      margin-bottom: 4px;
      animation: fadeInUp 0.8s ease-out 0.4s both;
    }

    .player-id {
      color: var(--accent-light);
      font-size: calc(var(--fs) * 14px);
      font-weight: 500;
      opacity: 0.9;
      animation: fadeInUp 0.8s ease-out 0.5s both;
    }

    .reason-section {
      margin-top: 8px;
    }

    .reason-title {
      color: var(--fg-dim);
      font-size: calc(var(--fs) * 11px);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      animation: fadeInUp 0.8s ease-out 0.6s both;
    }

    .reason-text {
      background: 
        linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.08)),
        var(--bg3);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--fg);
      font-size: calc(var(--fs) * 15px);
      line-height: 1.4;
      font-weight: 500;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.8s ease-out 0.7s both;
      word-wrap: break-word;
      max-height: 90px;
      overflow-y: auto;
    }

    .reason-text::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.1), transparent);
      animation: shimmer 2.5s ease-in-out infinite;
    }

    .reason-text::-webkit-scrollbar {
      width: 4px;
    }

    .reason-text::-webkit-scrollbar-track {
      background: transparent;
    }

    .reason-text::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 2px;
    }

    .reason-text::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.5);
    }

    @media (max-width: 1100px) {
      :root { --fs: 0.9; }
    }

    @media (max-width: 900px) {
      :root { --fs: 0.8; }
    }

    @media (max-width: 700px) {
      :root { --fs: 0.7; }
      .card { padding: 20px; }
    }

    .card, .reason-text {
      will-change: transform, opacity;
    }

    * {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="card">
      <div class="header">
        <div class="status">
          <div class="status-dot"></div>
          <div class="status-text">DISCONNECTED</div>
        </div>
        <div class="timestamp" id="timestamp">--:--</div>
      </div>

      <div class="player-info">
        <div class="player-name" id="playerName">Player</div>
        <div class="player-id" id="playerId">identifier:n/a</div>
      </div>

      <div class="reason-section">
        <div class="reason-title" id="reasonTitle">Alasan</div>
        <div class="reason-text" id="reasonText">Waiting for data...</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const elements = {
        card: document.getElementById('card'),
        timestamp: document.getElementById('timestamp'),
        playerName: document.getElementById('playerName'),
        playerId: document.getElementById('playerId'),
        reasonTitle: document.getElementById('reasonTitle'),
        reasonText: document.getElementById('reasonText')
      };

      function updateScale() {
        const vw = Math.max(800, Math.min(1600, window.innerWidth));
        const vh = Math.max(400, Math.min(800, window.innerHeight));
        const baseScale = Math.min(vw / 1600, vh / 800);
        
        document.documentElement.style.setProperty('--fs', 
          String(baseScale * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))));
      }

      function sanitize(str) {
        return String(str || '').replace(/[<>]/g, '').trim();
      }

      function applyData(data) {
        if (!data) return;

        if (data.fontScale && typeof data.fontScale === 'number') {
          document.documentElement.style.setProperty('--fs', String(data.fontScale));
        }

        if (data.time) elements.timestamp.textContent = sanitize(data.time);
        if (data.title) elements.playerName.textContent = sanitize(data.title);
        if (data.subtitle) elements.playerId.textContent = sanitize(data.subtitle);
        if (data.reasonTitle) elements.reasonTitle.textContent = sanitize(data.reasonTitle);
        if (data.reason) {
          elements.reasonText.textContent = sanitize(data.reason);
          elements.reasonText.scrollTop = 0;
        }
      }

      function setDisplay(visible) {
        if (visible) {
          elements.card.classList.remove('closing');
        } else {
          elements.card.classList.add('closing');
        }
      }

      function parseUrlParams() {
        try {
          const params = new URLSearchParams(location.search);
          if (params.toString()) {
            return {
              fontScale: params.get('fs') ? parseFloat(params.get('fs')) : undefined,
              time: params.get('time') || undefined,
              title: params.get('title') || undefined,
              subtitle: params.get('sub') || undefined,
              reasonTitle: params.get('rt') || 'Alasan',
              reason: params.get('reason') || undefined
            };
          }
        } catch (e) {
          console.warn('Failed to parse URL params:', e);
        }
        return null;
      }

      function handleMessage(event) {
        const data = event.data;
        if (!data) return;

        switch (data.action) {
          case 'render':
            applyData(data.payload);
            break;
          case 'display':
            setDisplay(data.value);
            break;
        }
      }

      function init() {
        updateScale();
        
        const urlData = parseUrlParams();
        if (urlData) {
          applyData(urlData);
        } else {
          applyData({
            time: '--:--',
            title: 'Player',
            subtitle: 'identifier:n/a',
            reasonTitle: 'Alasan',
            reason: 'Waiting for data...'
          });
        }

        window.addEventListener('message', handleMessage);
        window.addEventListener('resize', updateScale);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
