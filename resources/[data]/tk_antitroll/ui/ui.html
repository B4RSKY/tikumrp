<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script
        defer
        src="https://unpkg.com/alpinejs@3.10.4/dist/cdn.min.js"
        ></script>
        <title>EndZone - Restricted</title>
        <script src="js/app.js" type="text/javascript"></script>
        <link rel="stylesheet" href="css/app.css" />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            ::-webkit-scrollbar {
                display: none;
            }
        </style>
    </head>
    <body x-data="main()" x-init="listen()">
        <div class="main-container" x-show="show" x-transition>
            <div class="restriction-badge fade-in">
                <h1 class="restriction-title">⚠️ RESTRICTED ACCESS</h1>
            </div>

            <div class="description-card fade-in">
                <h2 class="description-text">
                    Anda harus menunggu sesuai waktu yang tertera.
                    Saat ini, Anda tidak bisa memukul dan menembak.
                </h2>
            </div>

            <div class="timer-container fade-in">
                <div class="timer-grid">
                    <div class="timer-unit">
                        <div class="timer-value" x-text="jamLeft">24</div>
                        <div class="timer-label">Jam</div>
                    </div>
                    <div class="timer-unit">
                        <div class="timer-value" x-text="minleft">60</div>
                        <div class="timer-label">Menit</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
